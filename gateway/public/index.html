<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Navigateur distant</title>
<link rel="stylesheet" href="/static/client.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%2722%27 fill=%27%232563eb%27/%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%279%27 fill=%27%23fff%27/%3E%3C/svg%3E">
</head>
<body>
<div id="display" tabindex="0" aria-label="Écran du navigateur distant"></div>

<div id="overlay">
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <p id="status">Connexion au navigateur…</p>
    <button type="button" id="reconnect" hidden>Reconnecter</button>
  </div>
</div>

<div id="toolbar">
  <button type="button" id="menu-button" title="Menu" aria-haspopup="true" aria-expanded="false">⋯</button>
  <div id="menu" hidden role="menu">
    <div class="group">Fenêtres</div>
    <button type="button" data-action="next-window">Fenêtre suivante</button>
    <button type="button" data-action="close-window">Fermer la fenêtre active</button>
    <div class="group">Bureaux</div>
    <div class="row">
      <button type="button" data-action="desktop-1" title="Aller au bureau 1">1</button>
      <button type="button" data-action="desktop-2" title="Aller au bureau 2">2</button>
      <button type="button" data-action="desktop-3" title="Aller au bureau 3">3</button>
      <button type="button" data-action="desktop-4" title="Aller au bureau 4">4</button>
    </div>
    <div class="hint">Déplacer la fenêtre active vers :</div>
    <div class="row">
      <button type="button" data-action="send-1" title="Envoyer la fenêtre vers le bureau 1">→1</button>
      <button type="button" data-action="send-2" title="Envoyer la fenêtre vers le bureau 2">→2</button>
      <button type="button" data-action="send-3" title="Envoyer la fenêtre vers le bureau 3">→3</button>
      <button type="button" data-action="send-4" title="Envoyer la fenêtre vers le bureau 4">→4</button>
    </div>
    <div class="group">Qualité d'affichage</div>
    <button type="button" data-quality="haute" role="menuitemradio">Haute (net)</button>
    <button type="button" data-quality="moyenne" role="menuitemradio">Moyenne</button>
    <button type="button" data-quality="basse" role="menuitemradio">Basse (le plus rapide)</button>
    <div class="group">Session</div>
    <button type="button" data-action="fullscreen">Plein écran</button>
    <button type="button" data-action="paste">Envoyer du texte…</button>
    <button type="button" data-action="reconnect">Reconnecter</button>
    <a href="/__auth/logout">Déconnexion</a>
  </div>
</div>

<dialog id="paste-dialog">
  <form method="dialog">
    <label for="paste-text">Texte à placer dans le presse-papiers du navigateur distant</label>
    <textarea id="paste-text" rows="6"></textarea>
    <div class="actions">
      <button value="cancel" type="submit">Annuler</button>
      <button value="send" type="submit" class="primary">Envoyer</button>
    </div>
  </form>
</dialog>

<script type="module" src="/static/client.js"></script>
</body>
</html>
